services:
  - type: web
    name: ram-wedding-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      # Every secret here is `sync: false`, which means "prompt me in the
      # dashboard, never store a value in this file". No connection string,
      # password or key is ever committed to the repository.

      # Gates the whole site. The app refuses to boot without it.
      - key: DASHBOARD_PASSWORD
        sync: false

      # Neon PostgreSQL connection string. Without it the app would fall back
      # to SQLite on Render's ephemeral disk, which is wiped on every restart
      # and redeploy -- so the app refuses to boot in production rather than
      # lose every category and status move silently.
      - key: DATABASE_URL
        sync: false

      # Render generates and stores this for you; it signs the session cookie.
      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12.7"
